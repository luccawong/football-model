name: Collect Betfair Exchange Lite

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/exchange_watchlist.json'
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: exchange-lite-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect active targets
        run: python -m exchange_bridge.collector
      - name: Commit new exchange snapshots
        shell: bash
        run: |
          if [ ! -d exchange_packets ]; then
            echo "No exchange_packets directory; nothing to commit."
            exit 0
          fi
          git add exchange_packets
          if git diff --cached --quiet; then
            echo "No new exchange snapshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect Betfair Exchange Lite snapshot"
          git push
