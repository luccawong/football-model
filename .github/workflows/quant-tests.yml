name: GPT Quant Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/**'
      - 'exchange_bridge/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/quant-tests.yml'
  pull_request:
    paths:
      - 'gpt/**'
      - 'exchange_bridge/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run quant integrity tests
        run: python -m pytest tests -v
