name: GPT Quant Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'gpt/**'
      - 'exchange_bridge/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/quant-tests.yml'
  pull_request:
    paths:
      - 'gpt/**'
      - 'exchange_bridge/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/quant-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile prior tooling
        run: |
          python -m py_compile gpt/prior_engine.py gpt/prior_competition.py gpt/stage14_auto.py gpt/model_1_packet_bridge.py
          python -m py_compile scripts/build_titan_prior.py scripts/validate_model_1_prior.py scripts/stage14_from_v23_md.py
      - name: Run quant integrity tests
        run: python -m pytest tests -v
