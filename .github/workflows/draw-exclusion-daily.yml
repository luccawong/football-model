name: External Draw Exclusion Daily

on:
  schedule:
    # 17:10 and 18:10 Beijing time. A stale source date fails safely.
    - cron: "10 9,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draw-exclusion-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Freeze, parse, index, and QC
        run: python scripts/run_draw_exclusion_daily.py
      - name: Test label contract
        run: python -m unittest tests.test_external_draw_label tests.test_draw_exclusion tests.test_draw_markets -v
      - name: Preserve sensitive raw evidence outside Git history
        uses: actions/upload-artifact@v4
        with:
          name: draw-exclusion-raw-${{ github.run_id }}
          path: |
            draw_exclusion/raw/
            draw_exclusion/database/draw_exclusion.sqlite
          retention-days: 30
          if-no-files-found: error
      - name: Commit verified derived data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draw_exclusion/daily draw_exclusion/latest.json draw_exclusion/index.json draw_exclusion/reports/daily
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: freeze external draw labels $(date -u +%F)"
          git push
